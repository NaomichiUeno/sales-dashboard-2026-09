<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年9月チーム売上順位</title>
<style>
:root{
  color-scheme:dark;
  --gold:#E8C77A;
  --gold-light:#F6DEA0;
  --text:#F3F0E8;
  --muted:rgba(243,240,232,.55);
  --line:rgba(232,199,122,.20);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;padding:64px 32px;
  display:grid;place-items:center;
  background-color:#060B14;
  background-image:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(232,199,122,.055),transparent 75%),linear-gradient(180deg,#060B14 0%,#060B14 35%,#020408 100%);
  background-attachment:fixed;
  color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{width:min(100%,1040px)}
header{padding-bottom:32px;border-bottom:1px solid var(--line)}
.eyebrow{margin:0 0 18px;color:var(--gold);font-size:10px;font-weight:500;letter-spacing:.28em;line-height:1.8}
header strong{display:block;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(27px,3.4vw,42px);font-weight:500;letter-spacing:.07em;line-height:1.6}
header>span{display:block;margin-top:12px;color:var(--muted);font-size:11px;letter-spacing:.10em;line-height:1.8}
[hidden]{display:none!important}
.results{padding:44px 0 0}
.results h1{margin:0 0 26px;font-size:18px;font-weight:500;letter-spacing:.15em}
.ranking{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.rank-card{display:grid;grid-template-columns:64px 1fr auto;gap:24px;align-items:center;padding:27px 30px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 4px 16px rgba(0,0,0,.08)}
.rank-card:first-child{border-color:rgba(232,199,122,.42);background:linear-gradient(110deg,rgba(232,199,122,.07),rgba(255,255,255,.025))}
.rank{font-family:Georgia,serif;font-size:30px;font-weight:400;color:var(--muted)}
.rank-card:first-child .rank{color:var(--gold)}
.rank small{font-family:system-ui,sans-serif;font-size:11px;margin-left:6px}
.rank-team{font-size:18px;font-weight:500;letter-spacing:.07em}
.rank-money{text-align:right}
.rank-money span{display:block;color:var(--muted);font-size:10px;letter-spacing:.10em;margin-bottom:8px}
.rank-money strong{font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(24px,3.6vw,36px);font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank-card:first-child .rank-money strong{color:var(--gold-light)}
.result-note{font-size:10px;letter-spacing:.05em;color:var(--muted);margin:20px 0 0}
@media(max-width:540px){
  body{padding:36px 22px}
  header{padding-bottom:24px}
  .eyebrow{font-size:8px;letter-spacing:.18em;margin-bottom:14px}
  header strong{font-size:clamp(23px,5.9vw,31px);letter-spacing:.02em}
  header>span{font-size:10px;margin-top:10px}
  .results{padding-top:32px}.results h1{font-size:16px;margin-bottom:22px}
  .rank-card{grid-template-columns:36px 1fr;gap:10px 14px;padding:22px 20px}
  .rank{grid-row:1 / 3;font-size:28px}.rank small{margin-left:3px;font-size:10px}
  .rank-team{font-size:15px}.rank-money{grid-column:2;text-align:left}
  .rank-money strong{font-size:clamp(22px,6.6vw,32px)}.rank-money span{font-size:9px;margin-bottom:5px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <header><p class="eyebrow">2026 SEPTEMBER · TEAM SALES RANKING</p><strong>2026年9月チーム売上順位</strong><span>物販＋AI · CO差し引き後</span></header>
  <section class="results" id="results-screen" aria-labelledby="results-title">
    <h1 id="results-title">総合順位</h1>
    <ol class="ranking">
      <li class="rank-card"><div class="rank">1<small>位</small></div><div class="rank-team">Cチーム</div><div class="rank-money"><span>着金額</span><strong>¥189,833,900</strong></div></li>
      <li class="rank-card"><div class="rank">2<small>位</small></div><div class="rank-team">Aチーム</div><div class="rank-money"><span>着金額</span><strong>¥99,125,700</strong></div></li>
      <li class="rank-card"><div class="rank">3<small>位</small></div><div class="rank-team">Bチーム</div><div class="rank-money"><span>着金額</span><strong>¥67,778,812</strong></div></li>
    </ol>
    <p class="result-note">物販＋AI · CO差し引き後</p>
  </section>
</main>
</body>
</html>
