<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Report — 2026年9月</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:        #FFD700;
  --gold-light:  #FFF8C0;
  --gold-mid:    #E6A800;
  --gold-dark:   #7A5000;
  --gold-sheen:  #FFEC80;
  --crimson:     #8B0000;
  --crimson-mid: #B01020;
  --crimson-brt: #D42030;
  --bg-main:     #0D0800;
  --bg-card:     rgba(15,8,0,0.75);
  --border-gold: rgba(255,215,0,0.55);
  --text:        #F5EDD5;
  --text-muted:  #9A8A6A;
  --bussan-c:    #38BDF8;
  --ai-c:        #A78BFA;
  --red:         #E74C3C;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg-main);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== PARTICLES ===== */
#particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle {
  position: absolute; border-radius: 50%; opacity: 0;
  animation: pdrift var(--dur) var(--delay) infinite linear;
}
.particle.star {
  background: none; color: var(--gold); font-size: var(--sz);
  animation: twinkle var(--dur) var(--delay) infinite ease-in-out;
}
@keyframes pdrift {
  0%   { transform: translateY(-5vh) rotate(0deg); opacity: 0; }
  8%   { opacity: 0.55; } 92% { opacity: 0.1; }
  100% { transform: translateY(105vh) rotate(var(--rot)); opacity: 0; }
}
@keyframes twinkle {
  0%,100% { opacity: 0; transform: scale(0.5); }
  40%      { opacity: 0.8; transform: scale(1.1); }
}

/* ===== CURTAIN ===== */
.curtain-wrap {
  position: relative;
  width: 100%;
  padding-bottom: 0;
  overflow: hidden;
}

/* Main red curtain background */
.curtain-bg {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(10,2,4,0.55) 0%, rgba(10,2,4,0.35) 40%, rgba(10,2,4,0.7) 100%),
    url('images/curtain-bg.png') center top / cover no-repeat,
    #1A0206;
  z-index: 0;
}

/* Curtain fold shading */
.curtain-bg::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 40%, transparent 0%, rgba(10,2,4,0.45) 100%);
}

/* Curtain top gold rod */
.curtain-rod {
  position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 2;
  background: linear-gradient(90deg, transparent 0%, rgba(255,215,0,0.3) 20%, rgba(255,215,0,0.7) 50%, rgba(255,215,0,0.3) 80%, transparent 100%);
}

/* Curtain swag drapes (decorative) */
.curtain-swag {
  position: absolute; top: 18px; left: 0; right: 0; height: 60px; z-index: 1;
  background:
    radial-gradient(ellipse 20% 100% at 12% 0%, rgba(180,20,30,0.8) 0%, transparent 60%),
    radial-gradient(ellipse 20% 100% at 30% 0%, rgba(100,5,15,0.6) 0%, transparent 60%),
    radial-gradient(ellipse 20% 100% at 50% 0%, rgba(180,20,30,0.7) 0%, transparent 60%),
    radial-gradient(ellipse 20% 100% at 70% 0%, rgba(100,5,15,0.6) 0%, transparent 60%),
    radial-gradient(ellipse 20% 100% at 88% 0%, rgba(180,20,30,0.8) 0%, transparent 60%);
}

/* Content inside curtain */
.curtain-content {
  position: relative; z-index: 3;
  display: flex; flex-direction: column; align-items: center;
  padding: 80px 24px 55px;
}

/* Title */
.report-eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px, 1.1vw, 11px); letter-spacing: 6px;
  color: rgba(255,230,120,0.7); text-transform: uppercase;
  margin-bottom: 10px; text-shadow: 0 0 12px rgba(255,200,0,0.5);
}
.report-title {
  font-family: 'Noto Serif JP', serif;
  font-size: clamp(1.6rem, 4vw, 3.1rem); font-weight: 700;
  background: linear-gradient(180deg, #FFF6D0 0%, var(--gold-sheen) 30%, var(--gold) 65%, var(--gold-mid) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-align: center;
  filter:
    drop-shadow(0 2px 4px rgba(0,0,0,0.95))
    drop-shadow(0 4px 16px rgba(0,0,0,0.9))
    drop-shadow(0 0 30px rgba(0,0,0,0.7));
  letter-spacing: 4px;
  padding: 6px 0;
  position: relative;
  display: inline-block;
}
.title-wrap {
  text-align: center; margin-bottom: 48px;
  position: relative;
}
.title-wrap::before {
  content: '';
  position: absolute; inset: -20px -10% -20px -10%;
  background: radial-gradient(ellipse 60% 100% at 50% 50%, rgba(0,0,0,0.55) 0%, transparent 70%);
  pointer-events: none; z-index: -1;
}

/* ===== GOLD ORNAMENTAL FRAME (Total Sales) ===== */
.total-frame-outer {
  position: relative;
  padding: 4px;
  border-radius: 4px;
  background: linear-gradient(135deg, #7A5000 0%, #FFD700 25%, #FFF8C0 50%, #FFD700 75%, #7A5000 100%);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.8),
    0 0 30px rgba(255,215,0,0.4),
    0 0 80px rgba(255,150,0,0.15),
    inset 0 0 0 1px rgba(255,215,0,0.3);
  animation: fadeUp 0.9s 0.2s ease both;
  max-width: 680px; width: 100%;
}
.corner-gem { display: none; }

.total-frame-inner {
  background: linear-gradient(160deg, #120A00 0%, #1C1000 50%, #0D0700 100%);
  border-radius: 2px;
  padding: clamp(24px,4vh,40px) clamp(16px,3vw,40px);
  text-align: center;
  position: relative;
  overflow: hidden;
  container-type: inline-size;
}
/* Inner glow */
.total-frame-inner::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(255,200,0,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.total-label {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(8px,1vw,11px); letter-spacing: 5px;
  color: var(--gold-mid); text-transform: uppercase; margin-bottom: 12px; opacity: 0.7;
}
.total-amount {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(1.8rem, 11cqi, 4.5rem); font-weight: 900; line-height: 1;
  background: linear-gradient(180deg, #fff 0%, var(--gold-sheen) 30%, var(--gold) 60%, var(--gold-mid) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 2px 12px rgba(255,215,0,0.4));
  margin-bottom: 20px;
  white-space: nowrap;
  max-width: 100%;
}

/* 物販/AI pills */
.division-row {
  display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
}
.div-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 18px; border-radius: 100px; font-size: 13px; font-weight: 700;
  border: 1px solid;
}
.div-pill.bussan { background: rgba(14,165,233,0.1); border-color: var(--bussan-c); color: var(--bussan-c); }
.div-pill.ai     { background: rgba(124,58,237,0.1);  border-color: var(--ai-c);     color: var(--ai-c); }
.div-pill .plabel { font-size: 10px; letter-spacing: 2px; opacity: 0.7; }
.div-amt { font-family: 'Montserrat', sans-serif; }

/* Ornamental separator lines */
.ornament-line {
  display: flex; align-items: center; gap: 10px;
  margin: 30px auto; max-width: 500px;
  padding: 0 20px;
}
.ornament-line::before, .ornament-line::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), transparent);
}
.ornament-line span {
  font-size: 18px; color: var(--gold);
  text-shadow: 0 0 8px rgba(255,215,0,0.6);
  flex-shrink: 0;
}

/* ===== DARK SECTION (Teams + Chart) ===== */
.dark-section {
  position: relative; z-index: 1;
  background: linear-gradient(180deg, #1A0C00 0%, #0D0800 100%);
  padding: 42px 24px 60px;
}

/* Subtle gold top border */
.dark-section::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,215,0,0.4) 30%, rgba(255,215,0,0.6) 50%, rgba(255,215,0,0.4) 70%, transparent 100%);
}

.dark-inner {
  max-width: 1100px; margin: 0 auto;
}

.section-eyebrow {
  text-align: center; margin-bottom: 28px;
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; letter-spacing: 5px;
  color: rgba(255,215,0,0.45); text-transform: uppercase;
}

/* ===== TEAM CARDS (gold frames) ===== */
.team-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 36px;
  animation: fadeUp 1s 0.4s ease both;
}
@media (max-width: 680px) { .team-grid { grid-template-columns: 1fr; } }

/* Outer gold frame */
.team-frame {
  padding: 2px;
  border-radius: 6px;
  background: linear-gradient(145deg, #7A5000 0%, #E6A800 30%, #FFF8C0 50%, #E6A800 70%, #7A5000 100%);
  box-shadow: 0 0 20px rgba(255,215,0,0.12), 0 4px 24px rgba(0,0,0,0.6);
  position: relative;
  transition: box-shadow 0.2s, transform 0.2s;
}
.team-frame:hover {
  box-shadow: 0 0 35px rgba(255,215,0,0.22), 0 8px 32px rgba(0,0,0,0.7);
  transform: translateY(-3px);
}

/* TOP champion frame - 超豪華 */
.team-frame.champion {
  padding: 3px;
  background: linear-gradient(135deg,
    #E6A800 0%, #FFD700 15%, #FFF8C0 30%, #FFE566 45%,
    #FFF8C0 55%, #FFD700 70%, #E6A800 85%, #C8960A 100%);
  background-size: 220% 220%;
  animation: champ-shine 3.4s ease-in-out infinite;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.4),
    0 0 32px rgba(255,215,0,0.55),
    0 0 72px rgba(255,200,0,0.35),
    0 0 120px rgba(255,180,0,0.2),
    0 6px 32px rgba(0,0,0,0.8);
}
.team-frame.champion::before {
  content: '';
  position: absolute; inset: -12px;
  border-radius: 14px;
  background: radial-gradient(ellipse at center, rgba(255,215,0,0.35) 0%, rgba(255,170,0,0.15) 40%, transparent 70%);
  z-index: -1;
  animation: champ-halo 2.4s ease-in-out infinite;
  pointer-events: none;
}
.team-frame.champion:hover {
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.4),
    0 0 48px rgba(255,215,0,0.75),
    0 0 96px rgba(255,200,0,0.45),
    0 0 160px rgba(255,180,0,0.25),
    0 10px 40px rgba(0,0,0,0.9);
  transform: translateY(-3px);
}
@keyframes champ-shine {
  0%,100% { background-position: 0% 50%; }
  50%     { background-position: 100% 50%; }
}
@keyframes champ-halo {
  0%,100% { opacity: 0.5; transform: scale(1); }
  50%     { opacity: 1;   transform: scale(1.06); }
}

/* Inner card */
.team-card {
  background: linear-gradient(160deg, #160C00 0%, #1E1000 60%, #0E0800 100%);
  border-radius: 4px;
  padding: 22px 18px 16px;
  position: relative;
  overflow: hidden;
}
.team-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,215,0,0.4), transparent);
}

.team-name {
  font-family: 'Montserrat', sans-serif;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--gold-mid); margin-bottom: 14px; opacity: 0.85;
  display: flex; align-items: center; gap: 10px;
  min-height: 42px;
}
.team-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #FFF8C0 0%, #FFD700 45%, #C8960A 100%);
  color: #2A1800;
  font-family: 'Montserrat', sans-serif;
  font-weight: 900; font-size: 18px; letter-spacing: 0;
  border: 1px solid rgba(255,215,0,0.5);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 2px 10px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.5),
    inset 0 -2px 4px rgba(120,80,0,0.35);
  text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  flex-shrink: 0;
}
.team-label { opacity: 0.8; }
.crown-wrap {
  position: relative; margin-left: auto;
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.crown-wrap::before {
  content: '';
  position: absolute; inset: -4px;
  background: radial-gradient(circle, rgba(255,215,0,0.55) 0%, rgba(255,150,0,0.25) 40%, transparent 70%);
  border-radius: 50%;
  animation: crown-halo 2.4s ease-in-out infinite;
  z-index: 0;
}
.team-name .crown {
  position: relative; z-index: 1;
  font-size: 30px;
  color: #FFE566;
  text-shadow:
    0 0 4px #FFF6C0,
    0 0 10px #FFD700,
    0 0 20px rgba(255,215,0,1),
    0 0 32px rgba(255,170,0,0.8),
    0 0 48px rgba(255,120,0,0.5),
    0 2px 4px rgba(80,40,0,0.6);
  animation: crown-bounce 2.4s ease-in-out infinite;
  transform-origin: center bottom;
}
.crown-wrap .sparkle {
  position: absolute; z-index: 2;
  color: #FFF6D0; font-size: 10px;
  opacity: 0; pointer-events: none;
  text-shadow: 0 0 6px #FFF, 0 0 12px rgba(255,215,0,0.9);
  animation: sparkle-pop 1.8s ease-in-out infinite;
}
.crown-wrap .sparkle.s1 { top: -4px; right: 2px; animation-delay: 0s; }
.crown-wrap .sparkle.s2 { bottom: 2px; left: -4px; animation-delay: 0.6s; font-size: 8px; }
.crown-wrap .sparkle.s3 { top: 12px; right: -6px; animation-delay: 1.2s; font-size: 12px; }
@keyframes crown-halo {
  0%,100% { opacity: 0.55; transform: scale(0.9); }
  50%     { opacity: 1;    transform: scale(1.18); }
}
@keyframes crown-bounce {
  0%,100% { transform: rotate(-8deg) translateY(0) scale(1); }
  50%     { transform: rotate(-8deg) translateY(-2px) scale(1.08); }
}
@keyframes sparkle-pop {
  0%,100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
  50%     { opacity: 1; transform: scale(1.3) rotate(180deg); }
}
.gross-row {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.gross-label {
  font-size: 11px; letter-spacing: 2px; font-weight: 700;
  color: var(--text-muted); opacity: 0.9;
}
.gross-amount {
  font-family: 'Montserrat', sans-serif;
  font-size: 15px; font-weight: 700; line-height: 1;
  color: rgba(245,237,213,0.85);
}
.team-total-row {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px;
}
.team-total-label {
  font-size: 11px; letter-spacing: 2px; font-weight: 700;
  color: var(--gold-mid); opacity: 0.9;
}
.team-total {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(1.4rem,2.8vw,2.1rem); font-weight: 900; line-height: 1;
  background: linear-gradient(180deg, #fff 0%, var(--gold-sheen) 40%, var(--gold) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

/* Breakdown lines */
.breakdown { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
.breakdown-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 2px; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.breakdown-row:last-child { border-bottom: none; }
.breakdown-icon {
  font-size: 11px; letter-spacing: 2px; font-weight: 700;
}
.breakdown-icon.bussan { color: var(--bussan-c); }
.breakdown-icon.ai     { color: var(--ai-c); }
.breakdown-amount { font-family:'Montserrat',sans-serif; font-size:14px; font-weight:700; text-align:right; }
.breakdown-amount.bussan { color: #7DD3FC; }
.breakdown-amount.ai     { color: #C4B5FD; }

/* CO金額 - 赤塗り×白文字 マイナス強調 */
.cooloff-box {
  display: flex; align-items: center; gap: 10px;
  margin: 0 -18px 14px; padding: 12px 18px;
  background: linear-gradient(135deg, #C21830 0%, #8B0818 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(0,0,0,0.3);
}
.cooloff-box .co-icon {
  color: #fff;
  font-size: 13px;
  flex-shrink: 0;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.cooloff-label {
  color: #fff;
  font-size: 11px; letter-spacing: 2px; font-weight: 700;
  flex-shrink: 0;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.cooloff-count {
  color: rgba(255,255,255,0.75);
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 700;
  flex-shrink: 0;
}
.cooloff-amount {
  margin-left: auto;
  font-family: 'Montserrat', sans-serif;
  font-size: 18px; font-weight: 900;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 0 12px rgba(255,255,255,0.2);
  letter-spacing: 0.5px;
}

/* ===== CHART ===== */
.chart-frame {
  padding: 2px; border-radius: 6px;
  background: linear-gradient(145deg, #5A3A00 0%, #C8900 30%, #E6A800 50%, #C8900 70%, #5A3A00 100%);
  box-shadow: 0 0 20px rgba(255,215,0,0.08);
  animation: fadeUp 1s 0.6s ease both;
}
.chart-inner {
  background: linear-gradient(160deg, #160C00 0%, #0E0800 100%);
  border-radius: 4px; padding: 24px;
}
.legend {
  display: flex; gap: 20px; justify-content: center; margin-bottom: 16px;
}
.legend-item { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-muted); }
.legend-dot  { width:10px; height:10px; border-radius:3px; }
.legend-dot.bussan { background: #38BDF8; }
.legend-dot.ai     { background: #A78BFA; }

/* ===== FOOTER ===== */
footer {
  text-align: center; padding: 28px 0 20px;
  font-size: 11px; color: rgba(255,215,0,0.25); letter-spacing: 3px;
}

@keyframes fadeUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<!-- ===== CURTAIN / HERO ===== -->
<div class="curtain-wrap">
  <div class="curtain-bg"></div>
  <div class="curtain-rod"></div>

  <div class="curtain-content">
    <div class="report-eyebrow">Monthly Sales Report</div>
    <div class="title-wrap"><div class="report-title">2026年9月 全体売上</div></div>

    <!-- TOTAL FRAME -->
    <div class="total-frame-outer">
      <span class="corner-gem tl">◆</span>
      <span class="corner-gem tr">◆</span>
      <span class="corner-gem bl">◆</span>
      <span class="corner-gem br">◆</span>
      <div class="total-frame-inner">
        <div class="total-label">Total Revenue — 物販 + AI</div>
        <div class="total-amount" id="totalAmount">¥0</div>
        <div class="division-row">
          <div class="div-pill bussan">
            <i class="fa-solid fa-box"></i>
            <span class="plabel">物販</span>
            <span class="div-amt" id="bussanTotal">¥0</span>
          </div>
          <div class="div-pill ai">
            <i class="fa-solid fa-microchip"></i>
            <span class="plabel">AI</span>
            <span class="div-amt" id="aiTotal">¥0</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== DARK SECTION ===== -->
<div class="dark-section">
  <div class="dark-inner">

    <!-- TEAM CARDS -->
    <div class="team-grid" id="teamGrid"></div>

  </div>
</div>

<footer>2026 Sales Team All-Hands &nbsp; · &nbsp; Confidential</footer>

<script>

    {

      bussan_net: 50_086_200, ai_net: 17_692_612,

    {
      name: "C チーム",
      bussan: 155_708_600, ai: 69_192_900,
      bussan_net: 138_332_800, ai_net: 51_501_100,
      cooloff: { amount: 35_067_600 },
    },
  ],
};
/* ============================================================ */

const totalBussan = DATA.teams.reduce((s,t) => s + t.bussan_net, 0);
const totalAI     = DATA.teams.reduce((s,t) => s + t.ai_net,     0);
const grandTotal  = totalBussan + totalAI;

const fmt = n => '¥' + n.toLocaleString('ja-JP');

function countUp(el, target, duration = 1600) {
  const step = 16, steps = duration / step; let i = 0;
  const timer = setInterval(() => {
    i++;
    const val = Math.round((1 - Math.pow(1 - i/steps, 3)) * target);
    el.textContent = '¥' + val.toLocaleString('ja-JP');
    if (i >= steps) { el.textContent = fmt(target); clearInterval(timer); }
  }, step);
}

// Hero
setTimeout(() => countUp(document.getElementById('totalAmount'),  grandTotal,   1800), 200);
setTimeout(() => countUp(document.getElementById('bussanTotal'), totalBussan,  1600), 350);
setTimeout(() => countUp(document.getElementById('aiTotal'),     totalAI,      1600), 450);

// Team cards
const teamGrid = document.getElementById('teamGrid');
const maxNet = Math.max(...DATA.teams.map(t => t.bussan_net + t.ai_net));
DATA.teams.forEach(t => {
  const net       = t.bussan_net + t.ai_net;
  const isTop     = net === maxNet;

  const frame = document.createElement('div');
  frame.className = 'team-frame' + (isTop ? ' champion' : '');

  const card = document.createElement('div');
  card.className = 'team-card';
  card.innerHTML = `
    <div class="team-name"><span class="team-badge">${t.name.charAt(0)}</span><span class="team-label">チーム</span>${isTop ? '<span class="crown-wrap"><i class="fa-solid fa-crown crown"></i><span class="sparkle s1">✦</span><span class="sparkle s2">✦</span><span class="sparkle s3">✦</span></span>' : ''}</div>
    <div class="team-total-row">
      <span class="team-total-label">合計</span>
      <span class="team-total" data-target="${net}">¥0</span>
    </div>
    <div class="cooloff-box">
      <i class="fa-solid fa-skull-crossbones co-icon"></i>
      <span class="cooloff-label">CO金額</span>
      <span class="cooloff-amount">-¥${t.cooloff.amount.toLocaleString('ja-JP')}</span>
    </div>
    <div class="gross-row">
      <span class="gross-label">売上総額</span>
      <span class="gross-amount" data-target="${t.bussan + t.ai}">¥0</span>
    </div>
    <div class="breakdown">
      <div class="breakdown-row">
        <span class="breakdown-icon bussan">物販</span>
        <span class="breakdown-amount bussan" data-target="${t.bussan_net}">¥0</span>
      </div>
      <div class="breakdown-row">
        <span class="breakdown-icon ai">AI</span>
        <span class="breakdown-amount ai" data-target="${t.ai_net}">¥0</span>
      </div>
    </div>
  `;
  frame.appendChild(card);
  teamGrid.appendChild(frame);
});

setTimeout(() => {
  document.querySelectorAll('.gross-amount[data-target]').forEach((el,i) =>
    countUp(el, +el.dataset.target, 1200 + i*80));
  document.querySelectorAll('.team-total[data-target]').forEach((el,i) =>
    countUp(el, +el.dataset.target, 1400 + i*100));
  document.querySelectorAll('.breakdown-amount[data-target]').forEach((el,i) =>
    countUp(el, +el.dataset.target, 1300 + i*80));
}, 500);

</script>
</body>
</html>
